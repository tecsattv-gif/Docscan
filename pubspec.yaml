name: docscan
description: Scanner de documentos e leitor de PDF.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^1.2.3
  pdf: ^3.11.1
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.0
  syncfusion_flutter_pdfviewer: ^27.1.48
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dev_dependencies:
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#1C1C1E"
  android_12:
    color: "#1C1C1E"
