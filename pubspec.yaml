name: docscan
description: Scanner de documentos e leitor de PDF.
publish_to: none
version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cunning_document_scanner: ^1.2.3
  pdf: ^3.11.1
  printing: ^5.13.2
  image: ^4.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.0
  syncfusion_flutter_pdfviewer: ^27.1.48
  syncfusion_flutter_pdf: ^27.1.48
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_mlkit_text_recognition: ">=0.13.0 <1.0.0"
  google_mlkit_barcode_scanning: ">=0.12.0 <1.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

dev_dependencies:
  flutter_native_splash: ^2.4.1

flutter_native_splash:
  color: "#232326"
  android_12:
    color: "#232326"

dependency_overrides:
  image: ">=4.10.0 <4.11.0"
