name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p lib/screens lib/services assets/fonts
          for f in *.dart; do
            [ -e "$f" ] || continue
            case "$f" in
              main.dart) mv "$f" lib/ ;;
              doc_store.dart|image_ops.dart|pdf_tools.dart) mv "$f" lib/services/ ;;
              *) mv "$f" lib/screens/ ;;
            esac
          done
          [ -f logo_docscan.png ] && mv logo_docscan.png assets/logo.png || true

      - name: Fonte completa para o Criar PDF
        continue-on-error: true
        run: |
          mkdir -p assets/fonts
          D=/usr/share/fonts/truetype/dejavu
          if [ ! -f $D/DejaVuSans.ttf ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          fi
          cp $D/DejaVuSans.ttf $D/DejaVuSans-Bold.ttf assets/fonts/
          ls -l assets/fonts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas android/ios
        run: flutter create --platforms=android,ios --org com.example --project-name docscan .

      - name: Icone do app
        run: |
          for d in icon/mipmap-*; do
            cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename $d)/ic_launcher.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Forcar compileSdk 36 nos plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      try {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      } catch (e: Exception) {
                          println("compileSdk nao alterado em " + name)
                      }
                  }
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          KTS
          else
          cat >> android/build.gradle <<'GRV'

          subprojects {
              def fixSdk = { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (state.executed) { fixSdk(project) } else { afterEvaluate { fixSdk(it) } }
          }
          GRV
          fi

      - name: Abrir PDFs com o DocScan
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'application/pdf' not in s:
              f = """
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <category android:name="android.intent.category.BROWSABLE"/>
                          <data android:mimeType="application/pdf"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="application/pdf"/>
                      </intent-filter>"""
              i = s.index('</intent-filter>') + len('</intent-filter>')
              s = s[:i] + f + s[i:]
              open(p, 'w').write(s)
          PY
          MA=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          PKG=$(head -1 "$MA")
          echo "$PKG" > "$MA"
          cat >> "$MA" <<'KT'

          import android.content.Intent
          import android.net.Uri
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private var channel: MethodChannel? = null
              private var pending: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  pending = copyFrom(intent)
                  intent = Intent()
                  channel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "docscan/open")
                  channel!!.setMethodCallHandler { call, result ->
                      if (call.method == "initialFile") {
                          result.success(pending)
                          pending = null
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(newIntent: Intent) {
                  super.onNewIntent(newIntent)
                  val p = copyFrom(newIntent) ?: return
                  pending = p
                  channel?.invokeMethod("fileOpened", p)
              }

              @Suppress("DEPRECATION")
              private fun copyFrom(i: Intent?): String? {
                  if (i == null) return null
                  val uri: Uri = when (i.action) {
                      Intent.ACTION_VIEW -> i.data
                      Intent.ACTION_SEND -> i.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)
                      else -> null
                  } ?: return null
                  return try {
                      var name = "documento.pdf"
                      contentResolver.query(uri, null, null, null, null)?.use { c ->
                          val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                          if (idx >= 0 && c.moveToFirst()) c.getString(idx)?.let { name = it }
                      }
                      name = name.replace(Regex("[\\\\/:*?\"<>|]"), "_")
                      if (!name.lowercase().endsWith(".pdf")) name += ".pdf"
                      val dir = File(cacheDir, "abertos")
                      dir.mkdirs()
                      val out = File(dir, name)
                      val input = contentResolver.openInputStream(uri) ?: return null
                      input.use { inp -> out.outputStream().use { inp.copyTo(it) } }
                      out.absolutePath
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          KT
          cat "$MA"

      - name: Icone e nome do app
        continue-on-error: true
        run: |
          sed -i 's/android:label="docscan"/android:label="DocScan"/' android/app/src/main/AndroidManifest.xml || true
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            mkdir -p "android/app/src/main/res/mipmap-$d"
            convert assets/logo.png -resize ${s}x${s} "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - run: flutter pub get
      - run: sed -i 's/signingConfig = signingConfigs.getByName("debug")/&\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: docscan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
