name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p lib/screens lib/services assets
          for f in *.dart; do
            [ -e "$f" ] || continue
            case "$f" in
              main.dart) mv "$f" lib/ ;;
              doc_store.dart|image_ops.dart|pdf_tools.dart) mv "$f" lib/services/ ;;
              *) mv "$f" lib/screens/ ;;
            esac
          done
          [ -f logo_docscan.png ] && mv logo_docscan.png assets/logo.png || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pastas android/ios
        run: flutter create --platforms=android,ios --org com.example --project-name docscan .

      - name: Forcar compileSdk 36 nos plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  val ext = extensions.findByName("android")
                  if (ext != null) {
                      try {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      } catch (e: Exception) {
                          println("compileSdk nao alterado em " + name)
                      }
                  }
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          KTS
          else
          cat >> android/build.gradle <<'GRV'

          subprojects {
              def fixSdk = { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (state.executed) { fixSdk(project) } else { afterEvaluate { fixSdk(it) } }
          }
          GRV
          fi

      - name: Icone e nome do app
        continue-on-error: true
        run: |
          sed -i 's/android:label="docscan"/android:label="DocScan"/' android/app/src/main/AndroidManifest.xml || true
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            mkdir -p "android/app/src/main/res/mipmap-$d"
            convert assets/logo.png -resize ${s}x${s} "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - run: flutter pub get

      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: docscan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
